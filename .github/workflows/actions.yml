name: conversor

on:
  push:
    branches:
      - test


jobs:
  compile-test-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compila el programa
        run: make conversor

      - name: Executa el programa
        run: ./conversor c2f 100

  compile-test-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compila el programa
        run: make conversor

      - name: Executa el programa
        run: ./conversor c2f 100